name: Manual validation
on:
  workflow_dispatch:
    inputs:
      run_pymc:
        description: 'Run pinned pymcprotocol 0.3.0 compatibility gate (only localhost)'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  m1:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: M1 loopback regression
        run: python -m pytest tests/test_virtual_plc.py -q --junitxml=m1-smoke.xml
      - name: Install SHA-pinned pymcprotocol wheel
        if: ${{ inputs.run_pymc }}
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r tests/compat/requirements-pymcprotocol.txt
      - name: External real-client 3E D/M gate
        if: ${{ inputs.run_pymc }}
        env:
          VIRTUALPLC_RUN_PYMC: '1'
        run: python -m pytest tests/compat -q --junitxml=m1-compat.xml
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-${{ matrix.os }}-${{ github.run_id }}
          path: |
            m1-smoke.xml
            m1-compat.xml
          if-no-files-found: warn
