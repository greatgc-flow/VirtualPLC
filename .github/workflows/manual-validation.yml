name: Manual validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest tests -q
