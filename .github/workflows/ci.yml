name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # PR runs supersede each other; every main push SHA keeps its own complete run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Widen Windows ephemeral port range (suite opens thousands of short connections)
        if: runner.os == 'Windows'
        run: netsh int ipv4 set dynamicport tcp start=10000 num=55000
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q
  test-macos:
    # Informational until green on main; not a required ruleset check yet.
    # continue-on-error keeps a red macOS job from failing the run that the
    # release gate (release.yml) requires to conclude "success".
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --no-deps dist/*.whl
          .smoke/bin/python -I -m virtual_plc --help
          .smoke/bin/python -I -c "from virtual_plc import Server, Memory; m=Memory(); m.load({'D': {'0': [123]}}); s=Server(memory=m); s.start(); assert s.memory.read_words('D',0,1)==[123]; s.stop()"
      - name: Run the bundled tests from the extracted sdist (isolated, no checkout imports)
        run: |
          mkdir -p "$RUNNER_TEMP/sdist" && tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/virtual_plc-*
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install . -r requirements-dev.txt
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
