name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --no-deps dist/*.whl
          .smoke/bin/python -I -m virtual_plc --help
          .smoke/bin/python -I -c "from virtual_plc import Server, Memory; m=Memory(); m.load({'D': {'0': [123]}}); s=Server(memory=m); s.start(); assert s.memory.read_words('D',0,1)==[123]; s.stop()"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
