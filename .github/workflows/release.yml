name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful main CI push run for the tagged commit (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
        run: |
          count=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$TAG_SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.head_sha == env.TAG_SHA and .event == "push" and .head_branch == "main" and .conclusion == "success")] | length')
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::No successful main CI push run for $TAG_SHA. Tag only after main CI is green."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag does not match pyproject version'
          PY
      - name: Extract curated release notes (fail closed before publishing)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-notes
          python tools/release_notes.py "${RELEASE_TAG#v}" docs/HANDOFF.md > release-notes/notes.md
      - run: python -m pip install -e . -r requirements-dev.txt -r requirements-release.txt
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Clean wheel smoke
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --no-deps dist/*.whl
          .smoke/bin/python -I -m virtual_plc --version
          .smoke/bin/python -I -c "from virtual_plc import Server; s=Server(); s.start(); s.stop()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/notes.md
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            # A release created beforehand keeps its body unless it is empty.
            if [ -z "$(gh release view "$RELEASE_TAG" --json body --jq .body)" ]; then
              gh release edit "$RELEASE_TAG" --notes-file release-notes/notes.md
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" \
              --notes-file release-notes/notes.md --generate-notes
          fi
