[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual_plc"
version = "0.2.0"
description = "Local Mitsubishi MC protocol PLC simulator with configurable response faults"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
virtual-plc = "virtual_plc.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["virtual_plc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real pinned-client reset timeout/sleep/reconnect behavior",
    "client_misbehaviour: client-misbehaviour observed with the pinned client",
]
