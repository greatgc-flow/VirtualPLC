[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualplc-mc-simulator"
version = "0.1.0"
description = "Loopback-only Mitsubishi MC/SLMP 3E Binary virtual PLC prototype"
requires-python = ">=3.10"
license = {text = "License to be determined before redistribution"}

[project.optional-dependencies]
test = ["pytest>=8,<10"]
compat = ["pymcprotocol"]

[tool.setuptools.packages.find]
include = ["virtual_plc*"]
