[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual_plc"
version = "0.5.0"
description = "Local Mitsubishi MC protocol PLC simulator with configurable response faults"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "greatgc-flow"}]
keywords = ["plc", "mitsubishi", "mc-protocol", "simulator", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/greatgc-flow/VirtualPLC"
Repository = "https://github.com/greatgc-flow/VirtualPLC"
Issues = "https://github.com/greatgc-flow/VirtualPLC/issues"

[project.scripts]
virtual-plc = "virtual_plc.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]
test = ["pytest", "pymcprotocol>=0.3.0"]

[tool.setuptools]
packages = ["virtual_plc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real pinned-client reset timeout/sleep/reconnect behavior",
    "client_misbehaviour: client-misbehaviour observed with the pinned client",
]
