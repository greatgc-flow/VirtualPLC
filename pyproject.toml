[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualplc-mc-simulator"
version = "0.1.0"
description = "Experimental loopback-only Mitsubishi MC/SLMP 3E Binary virtual PLC"
requires-python = ">=3.11"
license = {text = "License to be determined before distribution"}

[project.optional-dependencies]
test = ["pytest>=8,<10"]
compat = ["pymcprotocol==0.3.0"]

[tool.setuptools.packages.find]
include = ["virtual_plc*"]
